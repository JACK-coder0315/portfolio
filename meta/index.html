<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Code Statistics</title>

  <link rel="stylesheet" href="../style.css" />

  <script type="module" src="https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm" defer></script>
  <script type="module" src="main.js" defer></script>
</head>

<body>
  <!-- 你的导航栏 -->
  <div id="nav-container"></div>
  <script src="../global.js"></script>

  <h1>Code Statistics</h1>

  <!-- ===== Summary ===== -->
  <h2>Summary</h2>
  <section id="stats"></section>

  <!-- ===== 第一组 Scrolly + Scatter ===== -->
  <h2>Commits by Time of Day</h2>
  <div id="scrollytelling">
    <div id="scroll-container1">
      <div id="scroll-date"></div>
      <div id="spacer1"></div>
      <div id="items-container1"></div>
    </div>
    <div id="chart"></div>
  </div>

  <!-- ===== 第二组 Scrolly + Scatter ===== -->
  <h2>Daily Work Summary</h2>
  <div id="daily-scrollytelling">
    <!-- 先放散点，再放滚动框 -->
    <div id="daily-chart"></div>
    <div id="scroll-container2">
      <div id="spacer2"></div>
      <div id="items-container2"></div>
    </div>
  </div>

  <!-- ===== 可选的文件单位可视化 ===== -->
  <dl class="files"></dl>

  <!-- ===== Tooltip ===== -->
  <dl id="commit-tooltip" class="commit-tip" hidden>
    <dt>COMMIT</dt><dd id="tip-id"></dd>
    <dt>DATE</dt><dd id="tip-date"></dd>
    <dt>TIME</dt><dd id="tip-time"></dd>
    <dt>AUTHOR</dt><dd id="tip-author"></dd>
    <dt>LINES EDITED</dt><dd id="tip-lines"></dd>
  </dl>

  <!-- ===== Selection Stats ===== -->
  <div id="selection-summary">
    <p id="selection-count">No commits selected</p>
    <div id="language-breakdown"></div>
  </div>

  <!-- ===== 新增：总体时间过滤 + 散点 + 文件点可视化 ===== -->
  <h2>Commit Timeline Overview</h2>

  <!-- 时间滑块 -->
  <div id="overview-time-filter" style="display:flex; align-items:center; gap:1rem; margin-bottom:1rem;">
    <label for="overview-slider">Show commits until:</label>
    <input type="range" id="overview-slider" min="0" max="100" value="100" style="flex:1;">
    <span id="overview-time-display" style="white-space:nowrap; font-weight:bold;"></span>
  </div>

  <!-- 新的散点图容器 -->
  <div id="overview-chart" style="width:100%; height:400px; margin-bottom:2rem;"></div>

  <!-- 新的文件点可视化 -->
  <dl id="overview-files" class="files"></dl>


</body>

</html>
