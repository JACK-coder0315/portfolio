<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 8: 动画与滚动叙事</title>
  <!-- 全局样式 -->
  <link rel="stylesheet" href="../style.css" />
  <!-- 引入 D3 全局脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <!-- 本地逻辑脚本 -->
  <script src="main.js" defer></script>
</head>
<body>
  <div id="nav-container"></div>
  <script src="../global.js"></script>

  <h1>Lab 8: 动画与滚动叙事</h1>

  <!-- 演进可视化：滑块 -->
  <section id="evolution">
    <label>进度：<span id="date-label"></span></label>
    <input type="range" id="slider" min="0" max="100" value="0">
    <svg id="evo-chart" width="600" height="400"></svg>
  </section>

  <!-- 最大文件大比拼 -->
  <section id="file-race">
    <h2>最大文件大比拼</h2>
    <dl class="files"></dl>
  </section>

  <!-- 滚动叙事 Part 1: Commits -->
  <div id="scrollytelling-commits">
    <div id="scroll-container-commits">
      <div id="spacer-commits"></div>
      <div id="items-container-commits"></div>
    </div>
    <div id="chart-commits"></div>
  </div>

  <!-- 滚动叙事 Part 2: Files -->
  <div id="scrollytelling-files">
    <div id="scroll-container-files">
      <div id="spacer-files"></div>
      <div id="items-container-files"></div>
    </div>
    <div id="chart-files">
      <dl class="files"></dl>
    </div>
  </div>
</body>
</html>
</html>
