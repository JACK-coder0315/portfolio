<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Code Statistics</title>

  <link rel="stylesheet" href="../style.css" />

  <script type="module" src="https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm" defer></script>
  <script type="module" src="main.js" defer></script>
</head>

<body>
  <!-- 你的导航栏 -->
  <div id="nav-container"></div>
  <script src="../global.js"></script>

  <h1>Code Statistics</h1>

  <!-- ===== Summary ===== -->
  <h2>Summary</h2>
  <section id="stats"></section>

  <!-- ===== 第一组 Scrolly + Scatter ===== -->
  <h2>Commits by Time of Day</h2>
  <div id="scrollytelling">
    <!-- 左侧滚动区 -->
    <div id="scroll-container1">
      <div id="scroll-date"></div>
      <div id="spacer1"></div>
      <div id="items-container1"></div>
    </div>
    <!-- 右侧散点图 -->
    <div id="chart"></div>
  </div>

  <!-- ===== 第二组 Scrolly + Scatter ===== -->
  <h2>Daily Work Summary</h2>
  <div id="daily-scrollytelling">
    <!-- 右侧散点图 改到左边 -->
    <div id="daily-chart"></div>
    <!-- 左侧滚动区 改到右边 -->
    <div id="scroll-container2">
      <div id="spacer2"></div>
      <div id="items-container2"></div>
    </div>
  </div>

  <!-- ===== 可选的文件单位可视化 ===== -->
  <dl class="files"></dl>

  <!-- ===== Tooltip ===== -->
  <dl id="commit-tooltip" class="commit-tip" hidden>
    <dt>COMMIT</dt><dd id="tip-id"></dd>
    <dt>DATE</dt><dd id="tip-date"></dd>
    <dt>TIME</dt><dd id="tip-time"></dd>
    <dt>AUTHOR</dt><dd id="tip-author"></dd>
    <dt>LINES EDITED</dt><dd id="tip-lines"></dd>
  </dl>

  <!-- ===== Selection Stats ===== -->
  <div id="selection-summary">
    <p id="selection-count">No commits selected</p>
    <div id="language-breakdown"></div>
  </div>
</body>

</html>
